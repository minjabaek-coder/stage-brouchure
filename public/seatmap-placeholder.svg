<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-label="좌석 배치도 (시안)">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1612"/>
      <stop offset="1" stop-color="#0a0a0c"/>
    </linearGradient>
    <linearGradient id="stage" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5c1a1b"/>
      <stop offset="1" stop-color="#3d0e0f"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>

  <!-- Stage -->
  <rect x="160" y="60" width="480" height="60" rx="4" fill="url(#stage)" stroke="#c5a572" stroke-width="1.5"/>
  <text x="400" y="98" text-anchor="middle" font-family="serif" font-style="italic" font-size="22" fill="#e8d4a8" letter-spacing="6">STAGE</text>

  <!-- Aisle markers -->
  <line x1="395" y1="150" x2="395" y2="540" stroke="#c5a572" stroke-opacity="0.18" stroke-dasharray="4 6" stroke-width="1"/>
  <line x1="405" y1="150" x2="405" y2="540" stroke="#c5a572" stroke-opacity="0.18" stroke-dasharray="4 6" stroke-width="1"/>

  <!-- Seat grid (rows A..H, 14 seats per row split by central aisle) -->
  <g fill="#1a1a1f" stroke="#c5a572" stroke-opacity="0.55" stroke-width="0.8">
    <!-- generate rows -->
    <g id="rows">
      <!-- Row labels -->
      <g font-family="serif" font-size="13" fill="#c5a572" font-style="italic">
        <text x="92" y="186">A</text>
        <text x="92" y="226">B</text>
        <text x="92" y="266">C</text>
        <text x="92" y="306">D</text>
        <text x="92" y="346">E</text>
        <text x="92" y="386">F</text>
        <text x="92" y="426">G</text>
        <text x="92" y="466">H</text>
      </g>
    </g>
  </g>

  <!-- Seat circles via repeated <use> would be verbose; inline minimal grid. -->
  <g>
    <!-- Repeat 8 rows × (7 left + 7 right) seats -->
    <!-- Left block -->
    <g fill="#26221c" stroke="#c5a572" stroke-opacity="0.35" stroke-width="0.7">
      <g id="row-A-L"><circle cx="120" cy="180" r="9"/><circle cx="160" cy="180" r="9"/><circle cx="200" cy="180" r="9"/><circle cx="240" cy="180" r="9"/><circle cx="280" cy="180" r="9"/><circle cx="320" cy="180" r="9"/><circle cx="360" cy="180" r="9"/></g>
      <g><circle cx="120" cy="220" r="9"/><circle cx="160" cy="220" r="9"/><circle cx="200" cy="220" r="9"/><circle cx="240" cy="220" r="9"/><circle cx="280" cy="220" r="9"/><circle cx="320" cy="220" r="9"/><circle cx="360" cy="220" r="9"/></g>
      <g><circle cx="120" cy="260" r="9"/><circle cx="160" cy="260" r="9"/><circle cx="200" cy="260" r="9"/><circle cx="240" cy="260" r="9"/><circle cx="280" cy="260" r="9"/><circle cx="320" cy="260" r="9"/><circle cx="360" cy="260" r="9"/></g>
      <g><circle cx="120" cy="300" r="9"/><circle cx="160" cy="300" r="9"/><circle cx="200" cy="300" r="9"/><circle cx="240" cy="300" r="9"/><circle cx="280" cy="300" r="9"/><circle cx="320" cy="300" r="9"/><circle cx="360" cy="300" r="9"/></g>
      <g><circle cx="120" cy="340" r="9"/><circle cx="160" cy="340" r="9"/><circle cx="200" cy="340" r="9"/><circle cx="240" cy="340" r="9"/><circle cx="280" cy="340" r="9"/><circle cx="320" cy="340" r="9"/><circle cx="360" cy="340" r="9"/></g>
      <g><circle cx="120" cy="380" r="9"/><circle cx="160" cy="380" r="9"/><circle cx="200" cy="380" r="9"/><circle cx="240" cy="380" r="9"/><circle cx="280" cy="380" r="9"/><circle cx="320" cy="380" r="9"/><circle cx="360" cy="380" r="9"/></g>
      <g><circle cx="120" cy="420" r="9"/><circle cx="160" cy="420" r="9"/><circle cx="200" cy="420" r="9"/><circle cx="240" cy="420" r="9"/><circle cx="280" cy="420" r="9"/><circle cx="320" cy="420" r="9"/><circle cx="360" cy="420" r="9"/></g>
      <g><circle cx="120" cy="460" r="9"/><circle cx="160" cy="460" r="9"/><circle cx="200" cy="460" r="9"/><circle cx="240" cy="460" r="9"/><circle cx="280" cy="460" r="9"/><circle cx="320" cy="460" r="9"/><circle cx="360" cy="460" r="9"/></g>
    </g>
    <!-- Right block (mirror) -->
    <g fill="#26221c" stroke="#c5a572" stroke-opacity="0.35" stroke-width="0.7">
      <g><circle cx="440" cy="180" r="9"/><circle cx="480" cy="180" r="9"/><circle cx="520" cy="180" r="9"/><circle cx="560" cy="180" r="9"/><circle cx="600" cy="180" r="9"/><circle cx="640" cy="180" r="9"/><circle cx="680" cy="180" r="9"/></g>
      <g><circle cx="440" cy="220" r="9"/><circle cx="480" cy="220" r="9"/><circle cx="520" cy="220" r="9"/><circle cx="560" cy="220" r="9"/><circle cx="600" cy="220" r="9"/><circle cx="640" cy="220" r="9"/><circle cx="680" cy="220" r="9"/></g>
      <g><circle cx="440" cy="260" r="9"/><circle cx="480" cy="260" r="9"/><circle cx="520" cy="260" r="9"/><circle cx="560" cy="260" r="9"/><circle cx="600" cy="260" r="9"/><circle cx="640" cy="260" r="9"/><circle cx="680" cy="260" r="9"/></g>
      <g><circle cx="440" cy="300" r="9"/><circle cx="480" cy="300" r="9"/><circle cx="520" cy="300" r="9"/><circle cx="560" cy="300" r="9"/><circle cx="600" cy="300" r="9"/><circle cx="640" cy="300" r="9"/><circle cx="680" cy="300" r="9"/></g>
      <g><circle cx="440" cy="340" r="9"/><circle cx="480" cy="340" r="9"/><circle cx="520" cy="340" r="9"/><circle cx="560" cy="340" r="9"/><circle cx="600" cy="340" r="9"/><circle cx="640" cy="340" r="9"/><circle cx="680" cy="340" r="9"/></g>
      <g><circle cx="440" cy="380" r="9"/><circle cx="480" cy="380" r="9"/><circle cx="520" cy="380" r="9"/><circle cx="560" cy="380" r="9"/><circle cx="600" cy="380" r="9"/><circle cx="640" cy="380" r="9"/><circle cx="680" cy="380" r="9"/></g>
      <g><circle cx="440" cy="420" r="9"/><circle cx="480" cy="420" r="9"/><circle cx="520" cy="420" r="9"/><circle cx="560" cy="420" r="9"/><circle cx="600" cy="420" r="9"/><circle cx="640" cy="420" r="9"/><circle cx="680" cy="420" r="9"/></g>
      <g><circle cx="440" cy="460" r="9"/><circle cx="480" cy="460" r="9"/><circle cx="520" cy="460" r="9"/><circle cx="560" cy="460" r="9"/><circle cx="600" cy="460" r="9"/><circle cx="640" cy="460" r="9"/><circle cx="680" cy="460" r="9"/></g>
    </g>
  </g>

  <text x="400" y="540" text-anchor="middle" font-family="serif" font-style="italic" font-size="13" fill="#c5a572" letter-spacing="6">PLACEHOLDER · upload via /admin</text>
  <text x="400" y="568" text-anchor="middle" font-family="serif" font-size="11" fill="#f4ede0" fill-opacity="0.45" letter-spacing="3">어울림 콘서트 좌석 배치 시안</text>
</svg>
